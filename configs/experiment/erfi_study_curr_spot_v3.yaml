# v3 terrain-curriculum ERFI study on Boston Dynamics Spot
#
# Third quadruped of the study, after Go1 and A1: Boston Dynamics Spot, 50.34 kg,
# four times their mass. Playground's own Spot joystick task is kept whole
# (reward, Kp 300 / Kd 1 + kv 20, action_scale 0.3, fall at ~32 deg tilt), as the
# Berkeley Humanoid study kept its task; the ERFI mixin builds the paper's
# 192-dim policy input on top (envs/spot/, envs/erfi.py LAYOUTS["spot"]).
#
# Recipe: v3 = history_target_error only. critic_sees_offset stays off, as on
# Go1 and A1 (the humanoid had it on).
#
# TORQUE LIMIT: 0.5 x the per-joint RMS actuator force of the best walking `none`
# policy (none/seed1, 3.79 m nominal), measured 2026-09-20 by
# runpod/run_spot_limits.sh -> scripts/measure_stance_torque.py, each joint
# averaged with its left/right mirror (fl<->fr, hl<->hr), front and hind kept
# distinct. Go1's 2.5 Nm would shift a Spot joint by 0.5 deg at Kp 300, hence the
# humanoid procedure. Resulting shift Delta q = tau/Kp: 1.4 deg hip abduction,
# 1.4 / 0.8 deg hip flexion (front / hind), 3.8 / 3.3 deg knee.
#
# Sweep 2026-09-20 (erfi_50 and rao, seed 0, 50 M): both walk at 0.25, 0.5 AND
# 1.0 x this vector (3.7-3.8 m nominal) -- the first robot in the programme on
# which RAO is not trapped in the standing optimum at any tested limit. 0.5 is
# kept as the paper's "half a stance torque" rule, shared with the humanoid, so
# the limit used here is CONSERVATIVE on Spot. (The sweep ran on the vector
# before the left/right fix; the two agree in total magnitude, differing only in
# its split across front and hind hips, up to 25 % on hip flexion.)
#
#   python scripts/train_curriculum.py --config configs/experiment/erfi_study_curr_spot_v3.yaml
#   python scripts/eval.py --config configs/experiment/erfi_study_curr_spot_v3.yaml --plot

name: erfi_study_curr_spot_v3
out: erfi_study_curr_spot_v3

conditions: [none, dr, rfi, rao, erfi_c, erfi_50]
seeds: [0, 1, 2]

train:
  robot: spot
  task: rough_terrain
  num_evals: 5               # per stage -> 20 curve points over the whole run
  history_len: 7             # 7 -> paper's 192-dim state
  policy_layers: [512, 512]
  value_layers: [512, 256, 128]
  symmetric_critic: false
  rfi_lim: [7.165, 7.097, 20.013, 7.165, 7.097, 20.013, 7.827, 4.237, 17.184, 7.827, 4.237, 17.184]   # measured 2026-09-20: 0.5 x RMS actuator force of seed1 (none), 50 x 8 s, 3.79 m nominal; left/right mirror-averaged (fl<->fr, hl<->hr), front and hind kept distinct
  rao_lim: [7.165, 7.097, 20.013, 7.165, 7.097, 20.013, 7.827, 4.237, 17.184, 7.827, 4.237, 17.184]   # measured 2026-09-20: 0.5 x RMS actuator force of seed1 (none), 50 x 8 s, 3.79 m nominal; left/right mirror-averaged (fl<->fr, hl<->hr), front and hind kept distinct
  impl: warp
  env_overrides:
    history_target_error: true

# Heightfield peak-to-peak relief in metres and steps per stage; 4 x 75 M = 300 M.
# Stage 0 runs on the rough scene at zero relief (friction 1.0, spawn 0.53 m), so
# only the relief changes between stages.
stages:
  - {terrain_amplitude: 0.0,   num_timesteps: 75_000_000}
  - {terrain_amplitude: 0.015, num_timesteps: 75_000_000}
  - {terrain_amplitude: 0.03,  num_timesteps: 75_000_000}
  - {terrain_amplitude: 0.05,  num_timesteps: 75_000_000}

eval:
  impl: jax
  n_episodes: 50
  duration_s: 8.0
  success_distance_m: 2.5
  command: [0.5, 0.0, 0.0]
  push_start_s: 1.0
  push_duration_s: 3.0
  params: [payload_kg, push_N, friction, gravity, kp_scale]
  # Go1's payload (0-6 kg) and push (0-40 N) levels as fractions of Go1's mass and
  # weight, resolved against Spot's 50.34 kg at evaluation: 0-23.7 kg, 0-158 N.
  level_fractions:
    payload_kg: [0.0, 0.0785, 0.157, 0.2354, 0.3139, 0.3924, 0.4708]
    push_N: [0.0, 0.04, 0.08, 0.12, 0.16, 0.2, 0.24, 0.32]
  levels:
    friction: [0.3, 0.5, 0.7, 0.85, 1.0, 1.15, 1.3]   # rough scene trains at 1.0
