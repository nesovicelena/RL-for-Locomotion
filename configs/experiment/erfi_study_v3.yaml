# v3 recipe: v2 plus the paper's joint-position history.
#
# The history holds q* - q (tracking error against the PD target the
# controller is holding), as in Campanaro et al. Sec. VI-B, instead of
# Playground's q - q_default used by v1 and v2. Kept separate from those runs
# because the policy input changes.
#
#   python scripts/train.py --config configs/experiment/erfi_study_v3.yaml
#   python scripts/eval.py  --config configs/experiment/erfi_study_v3.yaml --plot

name: erfi_study_v3
out: erfi_study_v3_l2.5       # relative to RL_EXPERIMENTS_DIR (or ./experiments)

conditions: [none, dr, rfi, rao, erfi_c, erfi_50]
seeds: [0, 1, 2]

train:
  robot: go1
  num_timesteps: 200_000_000
  num_evals: 10
  history_len: 7
  policy_layers: [512, 512]
  value_layers: [512, 256, 128]
  symmetric_critic: false
  rfi_lim: 2.5
  rao_lim: 2.5
  impl: warp
  env_overrides:
    reward_config.tracking_sigma: 0.1
    erfi.critic_sees_offset: true
    history_target_error: true

eval:
  impl: jax
  n_episodes: 50
  duration_s: 8.0
  success_distance_m: 2.5
  command: [0.5, 0.0, 0.0]
  push_start_s: 1.0
  push_duration_s: 3.0
  params: [payload_kg, push_N, friction, gravity, kp_scale]
